name: Nexus CI Pipeline

on:
  push:
    branches: [main, uat]
  pull_request:
    branches: [main, uat]

jobs:
  validate:
    name: Build, Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Turborepo Build & Checks
        run: npx turbo run build lint test
