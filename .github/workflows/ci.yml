name: Nexus CI Pipeline

on:
  push:
    branches: [main, uat]
  pull_request:
    branches: [main, uat]

jobs:
  validate:
    name: Build, Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js 22 LTS with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turborepo Build & Checks
        run: pnpm turbo run build lint test
