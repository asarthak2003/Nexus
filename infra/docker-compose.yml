# Local Databases, Message Brokers, Object Storage, and Auth servers
# Profiles can be used to start only the services needed for a specific phase

services:
  # ==========================================
  # PostgreSQL & Redis
  # ==========================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nexus-postgres
    profiles: ["core"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    profiles: ["core"]
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  # ==========================================
  # Message Brokers
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nexus-rabbitmq
    profiles: ["messaging"]
    ports:
      - "5672:5672"    # AMQP 0-9-1
      - "15672:15672"  # Management Web UI
      - "1883:1883"    # MQTT
      - "61613:61613"  # STOMP
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nexus-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexus-kafka
    profiles: ["messaging"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - nexus-net

  nats:
    image: nats:latest
    container_name: nexus-nats
    profiles: ["messaging"]
    ports:
      - "4222:4222"  # Client port
      - "8222:8222"  # HTTP Monitoring UI
    command: ["-js", "-m", "8222"]
    networks:
      - nexus-net

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: nexus-mosquitto
    profiles: ["messaging"]
    ports:
      - "1884:1883"  # MQTT Port (offset from RabbitMQ MQTT)
    networks:
      - nexus-net

  # ==========================================
  # Storage
  # ==========================================
  minio:
    image: minio/minio
    container_name: nexus-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - nexus-net

  # ==========================================
  # Authentication
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nexus-keycloak
    profiles: ["auth"]
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    networks:
      - nexus-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  minio_data:

networks:
  nexus-net:
    driver: bridge
